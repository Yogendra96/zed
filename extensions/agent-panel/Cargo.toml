[package]
name = "agent_panel"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "Apache-2.0"

[lib]
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
zed_extension_api = { path = "../../crates/extension_api" }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
anyhow = "1.0"
toml = "0.8"
chrono = "0.4"
uuid = { version = "1.0", features = ["v4"] }
dirs = "5"
