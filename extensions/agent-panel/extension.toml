id = "agent-panel"
name = "Agent Panel"
description = "Multi-Agent AI connector and orchestration engine."
version = "0.1.0"
schema_version = 1
authors = ["Yogendra <yogi@example.com>"]
repository = "https://github.com/Yogendra96/zed"

[slash_commands.agent]
description = "Invoke the AI agent"
requires_argument = true

[slash_commands.refactor]
description = "Request a refactor from the AI agent"
requires_argument = true

[slash_commands.explain]
description = "Request an explanation for code"
requires_argument = true

[slash_commands.test]
description = "Generate tests for code"
requires_argument = true

[slash_commands.audit]
description = "Audit code for security and style"
requires_argument = true

[slash_commands.chat]
description = "Freeform conversation with the AI agent"
requires_argument = true
